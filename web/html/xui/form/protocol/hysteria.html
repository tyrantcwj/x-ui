{{define "form/hysteria"}}
<a-form layout="inline">
    <a-form-item label="新增用户">
        <a-row>
            <a-button type="primary" size="small" @click="inbound.settings.addUser()">
                +
            </a-button>
        </a-row>
    </a-form-item>
</a-form>

<a-form v-for="(user, index) in inbound.settings.users" layout="inline">
    <a-divider>
        User [[ index + 1 ]]
        <a-icon type="delete" @click="() => inbound.settings.delUser(index)"
            style="color: rgb(255, 77, 79);cursor: pointer;" v-if="index != 0">
    </a-divider>

    <a-form-item label="密码">
        <a-input v-model.trim="user.auth" style="width: 260px"></a-input>
    </a-form-item>
    <a-form-item label="标识">
        <a-input v-model.trim="user.email" style="width: 160px"></a-input>
    </a-form-item>
</a-form>

<a-form layout="inline">
    <a-form-item label="UDP 空闲超时(秒)">
        <a-input-number v-model="inbound.stream.hysteria.udpIdleTimeout" :min="1"></a-input-number>
    </a-form-item>
</a-form>
{{end}}
