name: Release x-ui
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.3.3.15

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: "386"
            asset: x-ui-linux-386.tar.gz
            xray: Xray-linux-32.zip
            xraybin: xray-linux-386
            extra_apt: gcc-multilib
            cc: ""
          - goarch: amd64
            asset: x-ui-linux-amd64.tar.gz
            xray: Xray-linux-64.zip
            xraybin: xray-linux-amd64
            extra_apt: ""
            cc: ""
          - goarch: arm64
            asset: x-ui-linux-arm64.tar.gz
            xray: Xray-linux-arm64-v8a.zip
            xraybin: xray-linux-arm64
            extra_apt: gcc-aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
          - goarch: s390x
            asset: x-ui-linux-s390x.tar.gz
            xray: Xray-linux-s390x.zip
            xraybin: xray-linux-s390x
            extra_apt: gcc-s390x-linux-gnu
            cc: s390x-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20.x"
      - name: Build package
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip ${{ matrix.extra_apt }}
          if [ -n "${{ matrix.cc }}" ]; then
            export CC="${{ matrix.cc }}"
          fi
          go build -o xui-release -v main.go
          mkdir -p x-ui/bin
          cp xui-release x-ui/x-ui
          cp x-ui.service x-ui/x-ui.service
          cp x-ui.sh x-ui/x-ui.sh
          cd x-ui/bin
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/${{ matrix.xray }}
          unzip -q ${{ matrix.xray }}
          rm -f ${{ matrix.xray }} geoip.dat geosite.dat
          mv xray ${{ matrix.xraybin }}
          wget -q https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          wget -q https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          cd ../..
          tar -zcvf ${{ matrix.asset }} x-ui
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          files: ${{ matrix.asset }}
          generate_release_notes: true
